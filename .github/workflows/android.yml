name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$SDK" > local.properties
          if [ ! -d "$SDK/platforms/android-35" ]; then
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          fi
          echo "platforms: $(ls "$SDK/platforms" | tr '\n' ' ')"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cœurs natifs (Xray + hev-socks5-tunnel)
        run: bash scripts/fetch-deps.sh

      - name: Assemblage
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: APK debug
        uses: actions/upload-artifact@v4
        with:
          name: DEMS-VPN-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: APK release (non signé)
        uses: actions/upload-artifact@v4
        with:
          name: DEMS-VPN-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
