name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cœurs natifs (Xray + hev-socks5-tunnel)
        run: bash scripts/fetch-deps.sh

      - name: Assemblage
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: APK debug
        uses: actions/upload-artifact@v4
        with:
          name: DEMS-VPN-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: APK release (non signé)
        uses: actions/upload-artifact@v4
        with:
          name: DEMS-VPN-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
